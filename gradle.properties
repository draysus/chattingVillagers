# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.1.0
group=io.github.draysus.chattingvillagers
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Chatting Villagers
mod_author=Draysus
mod_id=chattingvillagers
license=MIT
credits=Draysus
description=Brings villages to life: villagers and wandering traders speak context-aware lines in chat and in speech bubbles above their heads.\n\nFeatures:\n- Lines depend on time of day, weather, profession, biome and surroundings\n- Villagers hold short conversations with each other\n- Jobless villagers and nitwits react when right-clicked\n- All lines can be edited in config/chattingvillagers/dialogue\n\nCommands (/chattingvillagers):\n- on | off | toggle | status: villager chat messages for yourself\n- bubbles on|off: speech bubbles for everyone (OP)\n- chat on|off: chat messages for everyone (OP)\n- frequency quiet|normal|busy: how often villagers talk (OP)\n- reload: reload config and dialogue files (OP)\n- debug: info about the nearest villager (OP)
minecraft_version_range=[1.21.1]
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Forge
forge_version=52.0.28
forge_loader_version_range=[52,)

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
